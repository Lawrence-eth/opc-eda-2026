name: repository-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install --requirement requirements-dev.txt
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Restore the pinned official evaluator
        run: |
          mkdir -p external
          git clone --filter=blob:none https://github.com/IntelLabs/FloorSet.git external/FloorSet
          git -C external/FloorSet checkout --detach aadddcc2238695eb21e6542b8a6cd9e9fe6b80fa

      - name: Verify pinned official sources
        run: >-
          python scripts/check_official_sources.py
          --floorset external/FloorSet
          --require-floorset

      - name: Run unit tests
        run: python -m pytest -q

      - name: Restore the manifest-bound release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p submission
          gh release download v32-prebeta-20260711 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern iccad2026_submission.tar.gz \
            --dir submission
          echo "72d8fc5b6c4831a6af3547bacc16f19c800f1991b413500efbe467db8aec72c3  submission/iccad2026_submission.tar.gz" \
            | sha256sum --check -

      - name: Audit and smoke-test the release package
        run: >-
          python scripts/audit_submission_package.py
          submission/iccad2026_submission.tar.gz
          --release-manifest results/release_manifest.json
          --require-notices
          --smoke

      - name: Run manifest-bound public release gate
        run: >-
          python scripts/check_public_release.py
          --floorset external/FloorSet
          --require-floorset

      - name: Verify organizer-wrapper provenance
        run: |
          echo "1c5c41e881d4966797cfbbc58c2ef113fdcb92e66686fa89dcdb6253989999bc  packaging/op_wrapper.py" \
            | sha256sum --check -

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
